<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heritage Explorer</title>
    <link rel="stylesheet" href="styles.css">
    <script src="main.js" defer></script>
</head>

<body>
    <header>
        <img src="images/tree.png" alt="tree logo">
        <h1>Heritage Explorer</h1>
        <nav>
            <ul class="main-nav">
                <li><a href="index.html">Home</a></li>
                <li><a href="people.html">People</a></li>
                <li><a href="pedigree.html">Pedigree</a></li>
                <li><a href="family_group.html">Record</a></li>
                <li><a href="heritage.html">Heritage</a></li>
            </ul>
        </nav>
    </header>
    <main id="main-content" role="main">
        <section aria-label="Add a Person">
            <form id="add-person">
                <h2>Add a Person</h2>

                <!--https://www.w3schools.com/tags/tag_select.asp-->
                <label for="relativeChoice">Make a Choice:</label>
                <select id="relativeChoice" name="relativeChoice" required>
                    <option value="">Choose an Option</option>
                    <option value="new">Add a New Person</option>
                    <option value="existing">Link an Existing Person</option>
                </select>

                <label for="relationship">Relationship: </label>

                <select id="relationship" name="relationship" required>
                    <option value="">Select Relationship</option>
                    <option value="self">Self</option>
                    <option value="other">Other Relationship</option>
                    <option value="son">Son</option>
                    <option value="daughter">daughter</option>
                    <option value="father">Father</option>
                    <option value="mother">Mother</option>
                    <option value="paternal-grandfather">Paternal Grandfather</option>
                    <option value="paternal-grandmother">Paternal Grandmother</option>
                    <option value="maternal-grandfather">Maternal Grandfather</option>
                    <option value="maternal-grandmother">Maternal Grandmother</option>
                    <!-- Need to refine the following: -->
                    <option value="great-grandfather">Great Grandfather</option>
                    <option value="great-grandmother">Great Grandmother</option>
                    <option value="second-great-grandfather">2nd Great Grandfather</option>
                    <option value="second-great-grandmother">2nd Great Grandmother</option>
                    <option value="third-great-grandfather">3rd Great Grandfather</option>
                    <option value="third-great-grandmother">3rd Great Grandmother</option>
                    <option value="fourth-great-grandfather">4th Great Grandfather</option>
                    <option value="fourth-great-grandmother">4th Great Grandmother</option>
                    <option value="fifth-great-grandfather">5th Great Grandfather</option>
                    <option value="fifth-great-grandmother">5th Great Grandmother</option>
                    <option value="sixth-great-grandfather">6th Great Grandfather</option>
                    <option value="sixth-great-grandmother">6th Great Grandmother</option>
                    <option value="seventh-great-grandfather">7th Great Grandfather</option>
                    <option value="seventh-great-grandmother">7th Great Grandmother</option>
                    <option value="eighth-great-grandfather">8th Great Grandfather</option>
                    <option value="eighth-great-grandmother">8th Great Grandmother</option>
                    <option value="ninth-great-grandfather">9th Great Grandfather</option>
                    <option value="ninth-great-grandmother">9th Great Grandmother</option>
                    <option value="tenth-great-grandfather">10th Great Grandfather</option>
                    <option value="tenth-great-grandmother">10th Great Grandmother</option>
                </select>
                <div id="person-fields">
                    <label for="firstName">First Name:</label>
                    <input type="text" id="firstName" name="firstName" required>

                    <label for="lastName">Last Name:</label>
                    <input type="text" id="lastName" name="lastName" required>

                    <label for="birthDate">Birth Date: </label>
                    <input type="date" id="birthDate" name="birthDate">

                    <!--  Places API from FamilySearch -->
                    <!--  https://developers.familysearch.org/main/docs/places -->

                    <label for="birthCounty">Birth County:</label>
                    <input type="text" id="birthCounty" name="birthCounty">


                    <label for="birthCity">Birth City:</label>
                    <input type="text" id="birthCity" name="birthCity">


                    <label for="birthState">Birth State:</label>
                    <input type="text" id="birthState" name="birthState">


                    <label for="birthCountry">Birth Country:</label>
                    <input type="text" id="birthCountry" name="birthCountry">

                    <label for="deathDate">Death Date: </label>
                    <input type="date" id="deathDate" name="deathDate">

                    <label for="deathCounty">Death County:</label>
                    <input type="text" id="deathCounty" name="deathCounty">

                    <label for="deathCity">Death City:</label>
                    <input type="text" id="deathCity" name="deathCity">

                    <label for="deathState">Death State:</label>
                    <input type="text" id="deathState" name="deathState">

                    <label for="deathCountry">Death Country:</label>
                    <input type="text" id="deathCountry" name="deathCountry">

                    <label for="spouseFirstName">Spouse First Name:</label>
                    <input type="text" id="spouseFirstName" name="spouseFirstName">

                    <label for="spouseLastName">Spouse Last Name:</label>
                    <input type="text" id="spouseLastName" name="spouseLastName">

                    <label for="marriageDate">Marriage Date: </label>
                    <input type="date" id="marriageDate" name="marriageDate">

                    <label for="marriageCounty">Marriage County:</label>
                    <input type="text" id="marriageCounty" name="marriageCounty">


                    <label for="marriageCity">Marriage City:</label>
                    <input type="text" id="marriageCity" name="marriageCity">


                    <label for="marriageState">Marriage State:</label>
                    <input type="text" id="marriageState" name="marriageState">


                    <label for="marriageCountry">Marriage Country:</label>
                    <input type="text" id="marriageCountry" name="marriageCountry">

                    <label for="spouseFatherFirstName">Spouse's Father's First Name:</label>
                    <input type="text" id="spouseFatherFirstName" name="spouseFatherFirstName">

                    <label for="spouseFatherLastName">Spouse's Father's Last Name:</label>
                    <input type="text" id="spouseFatherLastName" name="spouseFatherLastName">

                    <label for="spouseMotherFirstName">Spouse's Mother's First Name:</label>
                    <input type="text" id="spouseMotherFirstName" name="spouseMotherFirstName">

                    <label for="spouseMotherLastName">Spouse's Mother's Last Name:</label>
                    <input type="text" id="spouseMotherLastName" name="spouseMotherLastName">
                </div>

                <button id="formButton" type="submit">Add Person</button>
            </form>
        </section>
    </main>
</body>

</html>
