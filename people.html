<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heritage Explorer</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="styles/personForm.css">
    <script src="main.js" defer></script>
    <script src="js/personForm.js" defer></script>
</head>
<body>
    <header>
        <img src="images/tree.png" alt="tree logo">
        <h1>Heritage Explorer</h1>
        <nav>
            <ul class="main-nav">
                <li><a href="index.html">Home</a></li>
                <li><a href="people.html">People</a></li>
                <li><a href="pedigree.html">Pedigree</a></li>
                <li><a href="family-group.html">Record</a></li>
                <li><a href="heritage.html">Heritage</a></li>
            </ul>
        </nav>
    </header>
    <main id="main-content" role="main">
        <section aria-label="Manage People">
            <form id="person-form">
                <h2>People</h2>

                <label for="relativeChoice">Add or Load a Person:</label>
                <select id="relativeChoice" name="relativeChoice" required>
                    <option value="">Choose an Option</option>
                    <option value="new">Add a New Person</option>
                    <option value="existing">Load an Existing Person</option>
                </select>

                <div id="existing-people" hidden>
                    <label for="person-list">Choose a Person:</label>
                    <select id="person-list">
                        <option value="">Select a Person</option>
                    </select>
                </div>
                <div id="person-display"></div>

                <dialog id="person-modal">
                    <h3>Add a Person</h3>
                    <div id="person-fields">
                        <label for="firstName">First Name:</label>
                            <input type="text" id="firstName" name="firstName">
                        <label for="lastName">Last Name:</label>
                            <input type="text" id="lastName" name="lastName">
                        <fieldset>
                            <legend>Gender</legend>

                            <label>
                                <input type="radio" name="gender" value="male" required>
                                    Male
                            </label>

                            <label>
                                <input type="radio" name="gender" value="female">
                                Female
                            </label>

                            <label>
                                <input type="radio" name="gender" value="unknown">
                                Unknown
                            </label>
                        </fieldset>

                        <fieldset>
                            <legend>Status</legend>
                            <label>
                                <input type="radio" name="status" value="living" required>
                                Living
                            </label>
                            <label>
                                <input type="radio" name="status" value="deceased">
                                Deceased
                            </label>
                            <label>
                                <input type="radio" name="status" value="unknown">
                                Unknown
                            </label>
                        </fieldset>
                    
                        <fieldset>
                            <legend>Birth Date</legend>
                            <label for="birthMonth">Month:</label>
                            <select id="birthMonth" name="birthMonth">
                                <option value="">Select Month</option>
                                <option value="1">January</option>
                                <option value="2">February</option>
                                <option value="3">March</option>
                                <option value="4">April</option>
                                <option value="5">May</option>
                                <option value="6">June</option>
                                <option value="7">July</option>
                                <option value="8">August</option>
                                <option value="9">September</option>
                                <option value="10">October</option>
                                <option value="11">November</option>
                                <option value="12">December</option>
                            </select>
                            <label for="birthDay">Day:</label>
                            <input type="number" id="birthDay" name="birthDay" min="1" max="31">
                            <label for="birthYear">Year:</label>
                            <input type="number" id="birthYear" name="birthYear">
                        </fieldset>

                        <label for="birthCountry">Birth Country:</label>
                        <select id="birthCountry" name="birthCountry" required>
                            <option value="">Select Birth Country</option>
                        </select>
                    </div>
                    <button id="formButton" type="submit">Submit</button>
                    <button type="button" id="cancel-person">Cancel</button>
                </dialog>
            </form>
            <section id="people-search">
                <hr>
                <h3>Find a Person</h3>
                <label for="search-people">Search by name, year, or country:</label>
                <input
                    type="search"
                    id="search-people"
                    placeholder="Enter a name, year, or country..."
                >
                <hr>
                <button type="button" id="print-directory"><strong>Print Directory</strong></button>
                <p id="people-count"></p>
                <div id="people-directory"></div>
            </section>
                
            <dialog id="submit-message">
                <p id="message-text"></p>
                <button type="button" id="close-message" aria-label="close-message">x</button>
            </dialog>
        </section>
    </main>
</body>
</html>
